<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors connexion</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #F77F0FFF 0%, #AC8812FF 100%);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 400px;
    }
    h1 { font-size: 3rem; margin: 0; }
    p { font-size: 1.2rem; margin: 20px 0; }
    button {
      background: white;
      color: #E48912FF;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📡</h1>
    <h2>Vous êtes hors connexion</h2>
    <p>Veuillez vérifier votre connexion internet et réessayer.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
